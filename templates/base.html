<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d12">
  <meta name="description" content="Bavly Kamel — Data Science & AI student building projects with Python, data, machine learning and software.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bavly Kamel | Data Science & AI Student">
  <meta property="og:description" content="Building with data, AI and Python at Zewail City of Science and Technology.">
  <meta property="og:image" content="/static/images/og-placeholder.svg">
  <title>{% block title %}Bavly Kamel | Data Science & AI Student{% endblock %}</title>
  <script>
    (() => {
      let savedTheme = null;
      try { savedTheme = localStorage.getItem('bavly-theme'); } catch (_) {}
      document.documentElement.dataset.theme = savedTheme || 'dark';
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="{{ url_for('home') }}" aria-label="Bavly Kamel home"><span class="brand-mark">BK</span><span>Bavly Kamel</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"><span></span><span></span></button>
      <nav class="primary-nav" id="primary-nav" aria-label="Main navigation">
        {% if request.endpoint == 'home' %}
          <a class="nav-link is-active" href="#home" aria-current="page">Home</a><a class="nav-link" href="#about">About</a><a class="nav-link" href="#skills">Skills</a><a class="nav-link" href="#projects">Projects</a><a class="nav-link" href="#experience">Experience</a><a class="nav-link" href="#contact">Contact</a>
        {% else %}
          <a class="nav-link" href="{{ url_for('home') }}#home">Home</a><a class="nav-link" href="{{ url_for('home') }}#about">About</a><a class="nav-link" href="{{ url_for('home') }}#skills">Skills</a><a class="nav-link{% if request.endpoint in ['projects', 'project_detail'] %} is-active{% endif %}"{% if request.endpoint in ['projects', 'project_detail'] %} aria-current="page"{% endif %} href="{{ url_for('projects') }}">Projects</a><a class="nav-link" href="{{ url_for('home') }}#experience">Experience</a><a class="nav-link" href="{{ url_for('home') }}#contact">Contact</a>
        {% endif %}
        <a class="nav-github" href="https://github.com/BavlyK100" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Dark mode</span></button>
      </nav>
    </div>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="footer-inner"><div class="footer-identity"><a class="brand" href="{{ url_for('home') }}">Bavly Kamel</a><span>Data Science &amp; AI Student</span></div><div class="footer-links"><a href="https://github.com/BavlyK100" target="_blank" rel="noreferrer">GitHub ↗</a><a href="https://www.linkedin.com/in/bavlyk/" target="_blank" rel="noreferrer">LinkedIn ↗</a></div><span class="copyright">© 2026 Bavly Kamel</span></div>
  </footer>
</body>
</html>
